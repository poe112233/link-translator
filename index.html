<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微店转链工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; padding: 24px; }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: #1a1a1a; }
  label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  textarea {
    width: 100%; height: 120px; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 6px;
    font-size: 13px; line-height: 1.6; resize: vertical; font-family: monospace;
  }
  textarea:focus { outline: none; border-color: #1677ff; }
  input[type=text] {
    width: 100%; padding: 7px 10px; border: 1px solid #d9d9d9; border-radius: 6px;
    font-size: 13px; font-family: monospace;
  }
  input[type=text]:focus { outline: none; border-color: #1677ff; }
  .opt-row { margin-bottom: 12px; }
  .opt-hint { font-size: 12px; color: #aaa; margin-top: 4px; }
  .btn-row { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  button {
    padding: 7px 16px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff;
    font-size: 13px; cursor: pointer; transition: all .15s;
  }
  button:hover { border-color: #1677ff; color: #1677ff; }
  button.primary { background: #1677ff; color: #fff; border-color: #1677ff; }
  button.primary:hover { background: #4096ff; }
  .result-section { margin-top: 20px; }
  .result-item { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
  .result-item .src-label { font-size: 12px; color: #999; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-item .link-label { font-size: 12px; color: #666; margin-top: 12px; margin-bottom: 4px; font-weight: 600; }
  .result-item .link {
    font-size: 13px; color: #1677ff; word-break: break-all; line-height: 1.6;
    background: #f6f8fc; padding: 8px 10px; border-radius: 4px; font-family: monospace;
  }
  .result-item .formula {
    font-size: 12px; color: #555; word-break: break-all; line-height: 1.6;
    background: #f2fbf3; border: 1px solid #e0f0e2; padding: 8px 10px; border-radius: 4px; font-family: monospace;
  }
  .btn-line { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .batch-box { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .batch-box .batch-title { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .empty { color: #bbb; font-size: 13px; text-align: center; padding: 32px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>微店转链工具</h1>
  <label>输入微店原始链接（每行一个）</label>
  <textarea id="input" placeholder="https://weidian.com/item.html?itemID=7843481293&spider_token=xxx"></textarea>

  <div class="opt-row" style="margin-top:12px;">
    <label>Google 表格显示文案（{name} = 渠道名）</label>
    <input type="text" id="sheetText" value="{name} Buylink">
    <div class="opt-hint">用于 =HYPERLINK(链接, 显示文案) 的第二个参数，例如 Kakobuy 生成「Kakobuy Buylink」</div>
  </div>

  <div class="btn-row">
    <button class="primary" onclick="generate()">生成转链</button>
    <button onclick="clearAll()">清空</button>
  </div>
  <div class="result-section" id="results">
    <p class="empty">点击上方按钮生成转链结果</p>
  </div>
</div>

<script>
const CHANNELS = [
  { key: 'oopbuy', name: 'Oopbuy' },
  { key: 'kakaobuy', name: 'Kakobuy' },
  { key: 'uidbuy', name: 'Uidbuy' },
  { key: 'hipobuy', name: 'Hipobuy' },
  { key: 'litbuy', name: 'Litbuy' }
];

function extractItemID(url) {
  const m = url.match(/itemID[=&](\d+)/);
  return m ? m[1] : 'unknown';
}

function buildLinks(cleanUrl) {
  const itemID = extractItemID(cleanUrl);
  return {
    oopbuy: 'https://oopbuy.com/product/weidian/' + itemID + '?originKeywordUrl=' + encodeURIComponent(encodeURIComponent(cleanUrl)),
    kakaobuy: 'https://item.kakobuy.com/item/details?url=' + encodeURIComponent(cleanUrl),
    uidbuy: 'https://www.uidbuy.com/product/3/' + itemID,
    hipobuy: 'https://hipobuy.com/product/weidian/' + itemID,
    litbuy: 'https://litbuy.com/product/weidian/' + itemID + '?linkSearch=true'
  };
}

/* ---- Google 表格公式 ---- */
function sheetDisplayText(channelName) {
  const el = document.getElementById('sheetText');
  const tpl = (el && el.value.trim()) ? el.value.trim() : '{name} Buylink';
  return tpl.replace(/\{name\}/gi, channelName);
}

function escapeFormulaArg(str) {
  return String(str).replace(/"/g, '""');
}

function buildFormula(link, channelName) {
  return '=HYPERLINK("' + escapeFormulaArg(link) + '", "' + escapeFormulaArg(sheetDisplayText(channelName)) + '")';
}

function copyText(text, btn, okText) {
  okText = okText || '已复制';
  const done = () => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = okText;
    setTimeout(() => btn.textContent = orig, 1300);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  if (done) done();
}

function makeBatchBox(title, text, btnText, okText) {
  const box = document.createElement('div');
  box.className = 'batch-box';

  const t = document.createElement('div');
  t.className = 'batch-title';
  t.textContent = title;
  box.appendChild(t);

  const ta = document.createElement('textarea');
  ta.readOnly = true;
  ta.value = text;
  ta.style.cssText = 'height:96px;font-size:12px;font-family:monospace;padding:8px 10px;border:1px solid #e8e8e8;border-radius:6px;background:#f6f8fc;color:#333;resize:vertical;';
  box.appendChild(ta);

  const btn = document.createElement('button');
  btn.className = 'primary';
  btn.textContent = btnText;
  btn.style.marginTop = '8px';
  btn.onclick = function() { copyText(text, btn, okText); };
  box.appendChild(btn);

  return box;
}

function generate() {
  const raw = document.getElementById('input').value.trim();
  if (!raw) return;

  const lines = raw.split(/\n/).map(l => l.trim()).filter(l => l);
  const results = document.getElementById('results');
  results.innerHTML = '';

  // 批量：纯链接 TSV
  const linkRows = lines.map((url) => {
    const links = buildLinks(url);
    return CHANNELS.map(ch => links[ch.key]).join('\t');
  });
  results.appendChild(makeBatchBox(
    '批量表格 · 纯链接（可粘贴到 Excel / 飞书表格）',
    linkRows.join('\n'),
    '复制表格（纯链接）',
    '已复制表格'
  ));

  // 批量：Google 表格公式 TSV
  const formulaRows = lines.map((url) => {
    const links = buildLinks(url);
    return CHANNELS.map(ch => buildFormula(links[ch.key], ch.name)).join('\t');
  });
  results.appendChild(makeBatchBox(
    '批量表格 · Google 表格公式（粘贴到表格即变超链接）',
    formulaRows.join('\n'),
    '复制表格（公式）',
    '已复制公式'
  ));

  lines.forEach((cleanUrl) => {
    const links = buildLinks(cleanUrl);

    const card = document.createElement('div');
    card.className = 'result-item';

    const srcLabel = document.createElement('div');
    srcLabel.className = 'src-label';
    srcLabel.textContent = cleanUrl;
    card.appendChild(srcLabel);

    CHANNELS.forEach((ch) => {
      const link = links[ch.key];
      const formula = buildFormula(link, ch.name);

      const label = document.createElement('div');
      label.className = 'link-label';
      label.textContent = ch.name;
      card.appendChild(label);

      const linkDiv = document.createElement('div');
      linkDiv.className = 'link';
      linkDiv.textContent = link;
      card.appendChild(linkDiv);

      const linkBtnLine = document.createElement('div');
      linkBtnLine.className = 'btn-line';
      const linkBtn = document.createElement('button');
      linkBtn.textContent = '复制链接';
      linkBtn.onclick = function() { copyText(link, this); };
      linkBtnLine.appendChild(linkBtn);
      card.appendChild(linkBtnLine);

      const formulaDiv = document.createElement('div');
      formulaDiv.className = 'formula';
      formulaDiv.textContent = formula;
      card.appendChild(formulaDiv);

      const formulaBtnLine = document.createElement('div');
      formulaBtnLine.className = 'btn-line';
      const formulaBtn = document.createElement('button');
      formulaBtn.textContent = '复制公式';
      formulaBtn.onclick = function() { copyText(formula, this, '已复制公式'); };
      formulaBtnLine.appendChild(formulaBtn);
      card.appendChild(formulaBtnLine);
    });

    results.appendChild(card);
  });
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('results').innerHTML = '<p class="empty">点击上方按钮生成转链结果</p>';
}
</script>
</body>
</html>
